services:
  hello-py:
    build: ./python
    ports:
      - 3000:3000
    environment:
      - ENV_VALUE=hello-python

  hello-node:
    build: ./node
    ports:
      - 3001:3000
    environment:
      - ENV_VALUE=hello-node

  hello-springboot:
    build: ./springboot/hello-spring
    ports:
      - 8081:8080
    environment:
      - ENV_VALUE=hello-springboot