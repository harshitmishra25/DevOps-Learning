services:
    service-a:
        build:
          context: ./python/service-a
          dockerfile: Dockerfile
        depends_on:
            - service-b
        ports:
            - 3100:3000

        environment:
            - TAX_SERVICE_URL=http://service-b:4000
            - FRONTEND_URL=http://localhost:5173
        networks:
            - Compose-tax-network

    service-b:
      build:
          context: ./python/service-b
          dockerfile: Dockerfile
      ports:
            - 3200:4000    
      networks:
            - Compose-tax-network
    

    frontend:
        build:
            context: ./tax-calculator-frontend
            dockerfile: Dockerfile
        ports:
          - 5173:80
        depends_on:
            - service-a
        networks:
            - Compose-tax-network

networks:
  Compose-tax-network:
        driver: bridge
    