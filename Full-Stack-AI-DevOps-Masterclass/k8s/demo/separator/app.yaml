apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-python
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp-python
  template:
    metadata:
      labels:
        app: myapp-python
    spec:
      containers:
        - name: myapp-python
          image: harshit200525/python-app1
          # env:           this is not production grade
          #   - name: APP_MESSAGE
          #     value: "Hello from app.yaml"
          #   - name: DB_PASSWORD
          #     value: "cGFzc3dvcmQ="  #base64 encoded
          envFrom:
            - configMapRef:
                  name: python-app-config
            - secretRef:
                  name: python-db-secret
          ports:
            - containerPort: 3000
      
---

apiVersion: v1
kind: Service
metadata:
  name: myapp-python
spec:
  selector:
    app: myapp-python
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 30001

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: python-app-config
data:
  # APP_MESSAGE: "Hello from Kubernetes ConfigMap!"
  # MY_PASS: "124"
  PORT: "3000"
  ENV_VALUE: "Running in Docker"

---

apiVersion: v1
kind: Secret
metadata:
  name: python-db-secret
type: Opaque
data:
  DB_PASSWORD: cGFzc3dvcmQ=
