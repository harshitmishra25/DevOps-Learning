apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-node
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp-node
  template:
    metadata:
      labels:
        app: myapp-node
    spec:
      containers:
        - name: myapp-node
          image: harshit200525/node-app1
          # env:           this is not production grade
          #   - name: APP_MESSAGE
          #     value: "Hello from app.yaml"
          #   - name: DB_PASSWORD
          #     value: "cGFzc3dvcmQ="  #base64 encoded
          envFrom:
            - configMapRef:
                  name: node-app-config
            - secretRef:
                  name: node-db-secret
          ports:
            - containerPort: 3000
      
---

apiVersion: v1
kind: Service
metadata:
  name: myapp-node
spec:
  selector:
    app: myapp-node
  type: NodePort
  ports:
    - port: 80
      targetPort: 3000
      nodePort: 32001

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: node-app-config
data:
  # APP_MESSAGE: "Hello from Kubernetes ConfigMap!"
  # MY_PASS: "124"
  PORT: "3000"
  ENV_VALUE: "Running in Docker"

---

apiVersion: v1
kind: Secret
metadata:
  name: node-db-secret
type: Opaque
data:
  DB_PASSWORD: cGFzc3dvcmQ=
