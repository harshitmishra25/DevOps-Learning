apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp-springboot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp-springboot
  template:
    metadata:
      labels:
        app: myapp-springboot
    spec:
      containers:
        - name: myapp-springboot
          image: harshit200525/sprintboot-app1
          # env:           this is not production grade
          #   - name: APP_MESSAGE
          #     value: "Hello from app.yaml"
          #   - name: DB_PASSWORD
          #     value: "cGFzc3dvcmQ="  #base64 encoded
          envFrom:
            - configMapRef:
                  name: springboot-app-config
            - secretRef:
                  name: springboot-db-secret
          ports:
            - containerPort: 8080
      
---

apiVersion: v1
kind: Service
metadata:
  name: myapp-springboot
spec:
  selector:
    app: myapp-springboot
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30002

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: springboot-app-config
data:
  # APP_MESSAGE: "Hello from Kubernetes ConfigMap!"
  # MY_PASS: "124"
  PORT: "8080"
  ENV_VALUE: "Running in Docker"

---

apiVersion: v1
kind: Secret
metadata:
  name: springboot-db-secret
type: Opaque
data:
  DB_PASSWORD: cGFzc3dvcmQ=
